name: Deploy MERN Frontend

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/deploy-frontend.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        env:
          VITE_API_URL: https://mern-bug-tracker-api.livedemoapp.com
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::612120247054:role/GitHubActionsMERNDeployRole
          aws-region: us-east-1

      - name: Upload frontend to S3
        run: |
          aws s3 sync client/dist/ s3://mern-bug-tracker-app-frontend/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2P4EGN4DP4H56 \
            --paths "/*"
