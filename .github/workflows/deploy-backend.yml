name: Deploy MERN Backend

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy backend to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::612120247054:role/GitHubActionsMERNDeployRole
          aws-region: us-east-1

      - name: Deploy backend through AWS Systems Manager
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-058ed0ed5251a4763" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy MERN Bug Tracker backend" \
            --parameters 'commands=[
              "set -e",
              "sudo -u ec2-user bash -lc '\''cd /home/ec2-user/portfolio-projects/MERN-Bug-Tracker-App && git fetch origin main && git checkout main && git reset --hard origin/main'\''",
              "sudo -u ec2-user bash -lc '\''cd /home/ec2-user/portfolio-projects/MERN-Bug-Tracker-App/server && npm ci --omit=dev'\''",
              "systemctl restart mern-bug-tracker",
              "systemctl is-active --quiet mern-bug-tracker"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-058ed0ed5251a4763"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-058ed0ed5251a4763" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}'
